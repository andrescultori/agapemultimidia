# Cloudflare Workers with static assets. Static files are generated into dist/ by `npm run build:cf`.
# Secrets (never in this file) are set in the dashboard under Settings > Variables and Secrets: see .env.example.
name = "agapemultimidia"
main = "src/worker.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
# Keep the plain variables set in the dashboard; without this, every deploy removes them.
keep_vars = true

# Database access from the Worker (see ADMIN.md, setup step 4): Hyperdrive config "agapemultimidia-db" (query caching off).
# The ID is not a secret.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "742584c55f2144f29d1ddd0f43790279"

[assets]
directory = "./dist"
binding = "ASSETS"
# Only /api/* runs the Worker; everything else is served straight from the static assets.
run_worker_first = ["/api/*"]

# Observability: same values Cloudflare shows when you enable logs in the dashboard. Keeping them here stops a deploy
# from resetting the toggle. (Cloudflare also lists issue_detection = false; this Wrangler version rejects it, and it is off by default.) Logs: Worker > Observability. console.error output (e.g. "otp request failed") appears there.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
